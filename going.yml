# going.yml · events Abdullah is attending or attended. Feeds GOING badges, going.ics, and the taste loop.
# Backfilled 2026-09-04 from Gmail receipts (DICE, Resident Advisor, Eventbrite, AXS, Live Nation, Front Gate, TicketSwap, Xceed, Fourvenues, PremiumGuest, KYD Labs, intellitix), 2021-01-01 onward.
# Fields per event:
#   title      required
#   date       required, YYYY-MM-DD, first (or only) day
#   end_date   optional, YYYY-MM-DD, inclusive last day, multi-day events only
#   venue      required
#   promoters  optional, list. Who threw it.
#   saw        optional, list. Performers whose sets you ACTUALLY CAUGHT, live or DJ.
#              Prefilled ONLY where the title names a single artist. Strike anything wrong,
#              add support sets you caught. Multi-DJ bills left empty for your pass.
#   url        optional
#   note       optional, free text. "Left early, room was dead" is signal too.
# A receipt is intent, not attendance: DELETE any night you ended up skipping.
# Past events stay in this file forever: it doubles as the attendance ledger.

